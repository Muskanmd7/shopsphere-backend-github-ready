# ============================================================
# EXAMPLE CONFIGURATION FILE
# Copy this file to "application-local.properties" (or set the
# same-named environment variables directly) and fill in your
# own values. NEVER commit real secrets to version control.
# ============================================================

spring.application.name=shopsphere-backend

# Database
DB_URL=jdbc:postgresql://localhost:5432/shopsphere
DB_USERNAME=your_db_username
DB_PASSWORD=your_db_password

# Optional overrides (safe defaults already provided in application.properties)
DDL_AUTO=update
SHOW_SQL=true
SERVER_PORT=8083

# JWT
JWT_SECRET=replace_with_a_long_random_secret_key
JWT_EXPIRATION=6000000

# Gemini AI
GEMINI_API_KEY=your_gemini_api_key
GEMINI_API_URL=https://generativelanguage.googleapis.com/v1beta2/models/gemini-2.5-flash:generateContent
